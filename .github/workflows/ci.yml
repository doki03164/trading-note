name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: trading-journal-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run desktop:build -- --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: trading-journal-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run mobile:sync
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: trading-journal-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ios:profile
      - run: npm run mobile:sync
      - run: pod install
        working-directory: ios/App
      - run: xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
        working-directory: ios/App
      - name: Build unsigned iPhone IPA
        shell: bash
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP_PATH="build/device/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" "build/ipa/Payload/Trading Journal.app"
          (cd build/ipa && /usr/bin/zip -qry ../Trading-Journal-iOS-unsigned.ipa Payload)
          /usr/bin/unzip -t build/Trading-Journal-iOS-unsigned.ipa

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          ARCHS=$(lipo -archs "$APP_PATH/$EXECUTABLE")
          {
            echo "simulator_build=passed"
            echo "device_bundle=$APP_PATH"
            echo "bundle_id=$BUNDLE_ID"
            echo "device_architectures=$ARCHS"
            echo "ipa_zip_test=passed"
          } | tee build/ios-verification.txt
      - name: Validate iOS profile
        shell: bash
        working-directory: ios/App
        run: |
          plutil -lint ../distribution/Trading-Journal.mobileconfig
          grep -q 'com.apple.webClip.managed' ../distribution/Trading-Journal.mobileconfig
      - uses: actions/upload-artifact@v4
        with:
          name: trading-journal-ios
          path: |
            ios/App/build/Trading-Journal-iOS-unsigned.ipa
            ios/App/build/ios-verification.txt
            ios/distribution/Trading-Journal.mobileconfig
